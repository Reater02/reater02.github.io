name: Auto Update Bing Images CI

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"  # 每天UTC 1:00 (北京时间9:00)
  push:
    branches: [ gh-pages ]
    paths:
      - 'assets/js/bing.js'
      - 'assets/json/images.json'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 最小权限原则
    
    steps:
    # 步骤1: 检出代码
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 步骤2: 设置Node环境
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    # 步骤3: 安装依赖
    - name: Install dependencies
      run: npm ci
      working-directory: ./assets/js

    # 步骤4: 执行更新脚本
    - name: Run Bing image updater
      run: node ./assets/js/bing.js
      timeout-minutes: 5

    # 步骤5: 提交变更
    - name: Commit changes
      id: commit
      run: |
        if git diff --exit-code; then
          echo "No changes to commit."
          echo "changes_made=false" >> $GITHUB_OUTPUT
        else
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add assets/json/images.json
          git commit -m "[Automation] Update Bing wallpapers $(date +'%Y-%m-%d')"
          echo "changes_made=true" >> $GITHUB_OUTPUT
        fi

    # 步骤6: 推送变更(使用您的GH_TOKEN)
    - name: Push changes
      if: steps.commit.outputs.changes_made == 'true'
      uses: ad-m/github-push-action@v0.6.0
      with:
        github_token: ${{ secrets.GH_TOKEN }}  # 使用自定义密钥
        branch: gh-pages
        force: true
