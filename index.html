<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Reater的个人主页">
    <meta name="keywords" content="Reater, 个人主页, 技术博客">
    <meta name="author" content="Reater">
    <title>Reater02</title>
    
    <!-- 样式表 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Reater02/reater02.github.io@493df04ee51240174838c80fdafe5a020f3d9c13/assets/css/onlinewebfonts.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Reater02/reater02.github.io@493df04ee51240174838c80fdafe5a020f3d9c13/assets/css/vno.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Reater02/reater02.github.io@493df04ee51240174838c80fdafe5a020f3d9c13/assets/css/iconfont.css">
    
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="https://cdn.jsdelivr.net/gh/Reater02/reater02.github.io@493df04ee51240174838c80fdafe5a020f3d9c13/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/Reater02/reater02.github.io@493df04ee51240174838c80fdafe5a020f3d9c13/favicon.ico">

    <style>
        /* 基础样式保持不变 */
        .img-placeholder {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(120deg, #ececec 25%, #f5f5f5 37%, #ececec 63%);
            background-size: 200% 100%;
            animation: placeholder-wave 1.6s ease infinite;
        }

        @keyframes placeholder-wave {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .ih-item.circle {
            width: 120px;
            height: 120px;
        }

        .navigation--social {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 2rem;
        }

        .navigation--social .iconfont {
            font-size: 2rem;
            transition: transform 0.3s ease;
        }

        .navigation--social a:hover .iconfont {
            transform: translateY(-3px);
        }

        /* 背景图相关样式 */
        .panel-cover {
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), 
                       var(--dynamic-bg, linear-gradient(135deg, #1e3c72 0%, #2a5298 100%)) 
                       center/cover no-repeat fixed;
            min-height: 100vh;
            transition: background-image 0.8s ease;
        }

        /* 加载状态指示器 */
        .bg-status {
            position: fixed;
            top: 20px;
            right: 20px;
            color: rgba(255,255,255,0.9);
            padding: 8px 15px;
            background: rgba(0,0,0,0.6);
            border-radius: 20px;
            z-index: 999;
            display: none;
        }

        @media (max-width: 768px) {
            .img-placeholder {
                width: 100px;
                height: 100px;
            }
            .ih-item.circle {
                width: 100px;
                height: 100px;
            }
            .navigation--social {
                gap: 1.5rem;
            }
            .panel-cover {
                background-attachment: scroll;
            }
        }
    </style>
</head>

<body>
    <!-- 加载状态提示 -->
    <div class="bg-status" id="bgStatus">🔄 正在加载每日壁纸...</div>

    <!-- 主内容区 -->
    <header id="panel" class="panel-cover">
        <div class="panel-main">
            <div class="panel-main__inner panel-inverted">
                <div class="panel-main__content">
                    <!-- 头像部分 -->
                    <div class="ih-item circle effect right_to_left">
                        <a href="#" class="blog-button">
                            <div class="img">
                                <div class="img-placeholder"></div>
                                <img src="https://cdn.jsdelivr.net/gh/Reater02/reater02.github.io@gh-pages/assets/img/personlogo.webp"
                                    data-fallback="https://cdn.jsdelivr.net/gh/Reater02/reater02.github.io@gh-pages/assets/img/personlogo.jpg"
                                    alt="Reater头像"
                                    class="js-avatar iUp profilepic"
                                    loading="lazy"
                                    width="120"
                                    height="120"
                                    onerror="this.onerror=null;this.src=this.dataset.fallback">
                            </div>
                            <div class="info iUp">
                                <div class="info-back">
                                    <h2>Star</h2>
                                    <p>Shine</p>
                                </div>
                            </div>
                        </a>
                    </div>

                    <!-- 标题区 -->
                    <h1 class="panel-cover__title panel-title iUp">
                        <a href="#">Reater</a>
                    </h1>
                    <p class="panel-cover__subtitle panel-subtitle iUp">Everything Will Be Better</p>
                    <hr class="panel-cover__divider iUp">

                    <!-- 诗句引用 -->
                    <blockquote class="panel-cover__description iUp" id="hitokoto">
                        <p>如何得与凉风约，不共尘沙一并来！</p>
                        <footer>-「中牟道中」</footer>
                    </blockquote>

                    <!-- 导航菜单 -->
                    <div class="navigation-wrapper iUp">
                        <nav class="cover-navigation cover-navigation--primary">
                            <ul class="navigation">
                                <li class="navigation__item"><a href="/" class="blog-button">首页</a></li>
                                <li class="navigation__item"><a href="https://reater.cn:7070/" target="_blank" rel="noopener noreferrer" class="blog-button">Rcloud</a></li>
                                <li class="navigation__item"><a href="https://reater.cn:5001/" target="_blank" rel="noopener noreferrer" class="blog-button">群晖NAS</a></li>
                                <li class="navigation__item"><a href="https://github.com/Reater02/Reater02.github.io" target="_blank" rel="noopener noreferrer" class="blog-button">关于本站</a></li>
                            </ul>
                        </nav>

                        <!-- 社交链接 -->
                        <nav class="cover-navigation navigation--social">
                            <ul class="navigation">
                                <li class="navigation__item">
                                    <a href="https://github.com/Reater02" target="_blank" rel="noopener noreferrer" title="GitHub">
                                        <i class="social iconfont icon-github"></i>
                                    </a>
                                </li>
                                <li class="navigation__item">
                                    <a href="https://www.zhihu.com/people/reater" target="_blank" rel="noopener noreferrer" title="知乎">
                                        <i class="social iconfont icon-zhihu"></i>
                                    </a>
                                </li>
                                <li class="navigation__item">
                                    <a href="mailto:601632132@qq.com" title="邮箱">
                                        <i class="social iconfont icon-email"></i>
                                    </a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
            <div class="panel-cover--overlay cover-slate"></div>
        </div>

        <!-- 页脚 -->
        <div class="remark iUp">
            <p class="power">
                Powered by 
                <a href="https://hitokoto.cn/" target="_blank" rel="noopener noreferrer">Hitokoto</a> 
                & 
                <a href="https://www.jsdelivr.com/" target="_blank" rel="noopener noreferrer">jsDelivr</a>
            </p>
        </div>
    </header>

    <!-- 脚本 -->
    <script>
        // ================== iUp动画模块（修复语法错误） ==================
        var iUp = (function () {
            var time = 0;
            var duration = 150;
            
            return {
                clean: function() { time = 0; },
                up: function(element) {
                    setTimeout(function() {
                        element.classList.add("up");
                    }, time);
                    time += duration;
                },
                down: function(element) {
                    element.classList.remove("up");
                },
                toggle: function(element) {
                    setTimeout(function() {
                        element.classList.toggle("up");
                    }, time);
                    time += duration;
                }
            };
        })();

        // ================== 背景加载模块（修复JSON解析问题） ==================
        async function loadBingBackground() {
            const bgStatus = document.getElementById('bgStatus');
            const panel = document.querySelector('#panel');
            
            try {
                bgStatus.style.display = 'block';
                
                // 获取并处理JSON数据
                const response = await fetch('/assets/json/images.json');
                const jsonText = await response.text();
                
                // 处理JSONP格式
                const jsonData = JSON.parse(
                    jsonText
                        .replace(/^getBingImages$/, '')
                        .replace(/$;?\s*$/, '')
                );

                // 随机选择图片
                const randomIndex = Math.floor(Math.random() * jsonData.length);
                const imgUrl = 'https://www.bing.com' + jsonData[randomIndex];

                // 预加载验证
                const img = new Image();
                img.crossOrigin = "anonymous";
                
                await new Promise((resolve, reject) => {
                    img.onload = resolve;
                    img.onerror = () => reject(new Error('CORS限制'));
                    img.src = imgUrl;
                    setTimeout(() => reject('加载超时'), 10000);
                });

                panel.style.backgroundImage = `url(${imgUrl})`;
                
                // 添加版权信息
                const copyrightMatch = imgUrl.match(/OHR\.(\w+?)_/);
                if(copyrightMatch) {
                    const copyrightEl = document.createElement('div');
                    copyrightEl.className = 'bg-copyright';
                    copyrightEl.textContent = copyrightMatch[1].replace(/([A-Z])/g, ' $1').trim() + ' (Bing每日壁纸)';
                    document.body.appendChild(copyrightEl);
                }

            } catch (error) {
                console.error('背景加载失败:', error);
                panel.style.backgroundImage = 'linear-gradient(135deg, #1e3c72 0%, #2a5298 100%)';
            } finally {
                bgStatus.style.display = 'none';
            }
        }

        // ================== 主初始化逻辑 ==================
        document.addEventListener('DOMContentLoaded', function () {
            // 初始化动画
            document.querySelectorAll('.iUp').forEach(element => {
                iUp.up(element);
            });

            // 加载背景图
            loadBingBackground();

            // 加载Hitokoto
            const xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function() {
                if (this.readyState === 4 && this.status === 200) {
                    const res = JSON.parse(this.responseText);
                    const target = document.getElementById('hitokoto');
                    if(target) {
                        target.innerHTML = `${res.hitokoto}<br/><footer>-「${res.from}」</footer>`;
                    }
                }
            };
            xhr.open("GET", "https://v1.hitokoto.cn", true);
            xhr.send();

            // 移动端菜单交互
            const btnMobileMenu = document.querySelector('.btn-mobile-menu');
            const navigationWrapper = document.querySelector('.navigation-wrapper');
            
            if (btnMobileMenu && navigationWrapper) {
                btnMobileMenu.addEventListener('click', function() {
                    const isVisible = navigationWrapper.classList.contains('visible');
                    
                    // 动画处理
                    const animationEndHandler = function() {
                        navigationWrapper.classList.remove('animated', 'bounceOutUp');
                        navigationWrapper.removeEventListener('animationend', animationEndHandler);
                    };

                    if (isVisible) {
                        navigationWrapper.classList.add('animated', 'bounceOutUp');
                        navigationWrapper.addEventListener('animationend', animationEndHandler);
                    } else {
                        navigationWrapper.classList.add('visible', 'animated', 'bounceInDown');
                    }

                    // 切换按钮图标
                    this.classList.toggle('icon-angleup');
                    this.classList.toggle('icon-list');
                });
            }
        });
    </script>
</body>
</html>
