<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Reater的个人主页">
    <meta name="keywords" content="Reater, 个人主页, 技术博客">
    <meta name="author" content="Reater">
    <title>Reater02</title>
    
    <!-- 样式表 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Reater02/reater02.github.io@latest/assets/css/onlinewebfonts.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Reater02/reater02.github.io@latest/assets/css/vno.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Reater02/reater02.github.io@latest/assets/css/iconfont.css">
    
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="https://cdn.jsdelivr.net/gh/Reater02/reater02.github.io@latest/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/Reater02/reater02.github.io@latest/favicon.ico">

    <style>
        :root {
            --avatar-size: 120px;
            --social-icon-size: 2rem;
            --main-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }

        .img-placeholder, .ih-item.circle {
            width: var(--avatar-size);
            height: var(--avatar-size);
            border-radius: 50%;
            background: linear-gradient(120deg, #ececec 25%, #f5f5f5 37%, #ececec 63%);
            background-size: 200% 100%;
            animation: placeholder-wave 1.6s ease infinite;
        }

        @keyframes placeholder-wave {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .navigation--social {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 2rem;
        }

        .navigation--social .iconfont {
            font-size: var(--social-icon-size);
            transition: transform 0.3s ease;
        }

        .navigation--social a:hover .iconfont {
            transform: translateY(-3px);
        }

        .panel-cover {
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), 
                       var(--dynamic-bg, var(--main-gradient)) center/cover no-repeat fixed;
            min-height: 100vh;
            transition: background-image 0.8s ease;
        }

        .bg-status {
            position: fixed;
            top: 20px;
            right: 20px;
            color: rgba(255,255,255,0.9);
            padding: 8px 15px;
            background: rgba(0,0,0,0.6);
            border-radius: 20px;
            z-index: 999;
            display: none;
            backdrop-filter: blur(2px);
        }

        @media (max-width: 768px) {
            :root {
                --avatar-size: 100px;
                --social-icon-size: 1.5rem;
            }
            .panel-cover {
                background-attachment: scroll;
            }
            .bg-status {
                font-size: 12px;
                padding: 6px 12px;
            }
        }

        .bg-copyright {
            position: fixed;
            bottom: 15px;
            right: 20px;
            color: rgba(255,255,255,0.8);
            font-size: 12px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
    </style>
</head>

<body>
    <div class="bg-status" id="bgStatus">🔄 正在加载每日壁纸...</div>

    <header id="panel" class="panel-cover">
        <div class="panel-main">
            <div class="panel-main__inner panel-inverted">
                <div class="panel-main__content">
                    <div class="ih-item circle effect right_to_left">
                        <a href="#" class="blog-button">
                            <div class="img">
                                <div class="img-placeholder"></div>
                                <img src="https://cdn.jsdelivr.net/gh/Reater02/reater02.github.io@latest/assets/img/personlogo.webp"
                                    data-fallback="https://cdn.jsdelivr.net/gh/Reater02/reater02.github.io@latest/assets/img/personlogo.jpg"
                                    alt="Reater头像"
                                    class="js-avatar iUp profilepic"
                                    loading="lazy"
                                    width="120"
                                    height="120"
                                    onerror="this.onerror=null;this.src=this.dataset.fallback">
                            </div>
                            <div class="info iUp">
                                <div class="info-back">
                                    <h2>Star</h2>
                                    <p>Shine</p>
                                </div>
                            </div>
                        </a>
                    </div>

                    <h1 class="panel-cover__title panel-title iUp">
                        <a href="#">Reater</a>
                    </h1>
                    <p class="panel-cover__subtitle panel-subtitle iUp">Everything Will Be Better</p>
                    <hr class="panel-cover__divider iUp">

                    <blockquote class="panel-cover__description iUp" id="hitokoto">
                        <p>如何得与凉风约，不共尘沙一并来！</p>
                        <footer>-「中牟道中」</footer>
                    </blockquote>

                    <div class="navigation-wrapper iUp">
                        <nav class="cover-navigation cover-navigation--primary">
                            <ul class="navigation">
                                <li class="navigation__item"><a href="/" class="blog-button">首页</a></li>
                                <li class="navigation__item"><a href="https://reater.cn:7070/" target="_blank" rel="noopener" class="blog-button">Rcloud</a></li>
                                <li class="navigation__item"><a href="https://reater.cn:5001/" target="_blank" rel="noopener" class="blog-button">群晖NAS</a></li>
                                <li class="navigation__item"><a href="https://github.com/Reater02/Reater02.github.io" target="_blank" rel="noopener" class="blog-button">关于本站</a></li>
                            </ul>
                        </nav>

                        <nav class="cover-navigation navigation--social">
                            <ul class="navigation">
                                <li class="navigation__item">
                                    <a href="https://github.com/Reater02" target="_blank" rel="noopener" title="GitHub">
                                        <i class="social iconfont icon-github"></i>
                                    </a>
                                </li>
                                <li class="navigation__item">
                                    <a href="https://www.zhihu.com/people/reater" target="_blank" rel="noopener" title="知乎">
                                        <i class="social iconfont icon-zhihu"></i>
                                    </a>
                                </li>
                                <li class="navigation__item">
                                    <a href="mailto:601632132@qq.com" title="邮箱">
                                        <i class="social iconfont icon-email"></i>
                                    </a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
            <div class="panel-cover--overlay cover-slate"></div>
        </div>

        <div class="remark iUp">
            <p class="power">
                Powered by 
                <a href="https://hitokoto.cn/" target="_blank" rel="noopener">Hitokoto</a> 
                & 
                <a href="https://www.jsdelivr.com/" target="_blank" rel="noopener">jsDelivr</a>
            </p>
        </div>
    </header>

    <script>
        // iUp模块
        var iUp = (function () {
            let time = 0;
            const duration = 150;
            
            return {
                clean: () => time = 0,
                up: element => {
                    setTimeout(() => element.classList.add("up"), time);
                    time += duration;
                },
                down: element => element.classList.remove("up"),
                toggle: element => {
                    setTimeout(() => element.classList.toggle("up"), time);
                    time += duration;
                }
            };
        })();

        // 背景加载模块
        async function loadBingBackground() {
            const bgStatus = document.getElementById('bgStatus');
            const panel = document.querySelector('#panel');
            
            try {
                bgStatus.style.display = 'block';
                const response = await fetch('https://cdn.jsdelivr.net/gh/Reater02/reater02.github.io@latest/assets/json/images.json');
                if (!response.ok) throw new Error(`HTTP错误 ${response.status}`);
                
                const imgUrls = await response.json();
                const randomIndex = Math.floor(Math.random() * imgUrls.length);
                const imgPath = imgUrls[randomIndex];
                const proxyUrl = 'https://corsproxy.io/?';
                const imgUrl = proxyUrl + encodeURIComponent(`https://www.bing.com${imgPath}`);

                await new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => {
                        panel.style.backgroundImage = `url(${imgUrl})`;
                        resolve();
                    };
                    img.onerror = () => reject(new Error('图片加载失败'));
                    img.src = imgUrl;
                    setTimeout(() => reject('加载超时'), 10000);
                });

                // 添加版权信息
                const copyrightMatch = imgPath.match(/OHR\.(\w+?)_/);
                if (copyrightMatch) {
                    const copyrightEl = document.createElement('div');
                    copyrightEl.className = 'bg-copyright';
                    copyrightEl.textContent = `${copyrightMatch[1].replace(/([A-Z])/g, ' $1').trim()} (Bing每日壁纸)`;
                    document.body.appendChild(copyrightEl);
                }

            } catch (error) {
                console.error('背景加载失败:', error);
                panel.style.backgroundImage = 'var(--main-gradient)';
            } finally {
                bgStatus.style.display = 'none';
            }
        }

        // 移动端菜单
        function initMobileMenu() {
            const btn = document.querySelector('.btn-mobile-menu');
            const nav = document.querySelector('.navigation-wrapper');
            
            if (!btn || !nav) return;

            btn.addEventListener('click', () => {
                const isVisible = nav.classList.contains('visible');
                nav.classList.add('animate__animated', `animate__${isVisible ? 'fadeOutUp' : 'fadeInDown'}`);
                
                nav.addEventListener('animationend', () => {
                    nav.classList.remove('animate__animated', `animate__${isVisible ? 'fadeOutUp' : 'fadeInDown'}`);
                    nav.classList.toggle('visible', !isVisible);
                }, { once: true });

                btn.classList.toggle('icon-angleup');
                btn.classList.toggle('icon-list');
            });
        }

        // 主初始化
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.iUp').forEach(iUp.up);
            loadBingBackground();
            initMobileMenu();

            // 增强的一言获取
            fetch('https://v1.hitokoto.cn')
                .then(response => {
                    if (!response.ok) throw new Error('网络响应异常');
                    return response.json();
                })
                .then(data => {
                    const target = document.getElementById('hitokoto');
                    if (target) {
                        target.innerHTML = `${data.hitokoto}<br/><footer>-「${data.from}」</footer>`;
                    }
                })
                .catch(() => {
                    const defaultQuote = document.getElementById('hitokoto');
                    defaultQuote.innerHTML = `<p>如何得与凉风约，不共尘沙一并来！</p><footer>-「中牟道中」</footer>`;
                });

            // 头像加载处理
            const avatar = document.querySelector('.js-avatar');
            if (avatar) {
                avatar.addEventListener('load', () => avatar.style.opacity = 1);
                if (avatar.complete) avatar.style.opacity = 1;
            }
        });
    </script>
</body>
</html>
