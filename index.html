<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Reater的个人主页">
    <meta name="keywords" content="Reater, 个人主页, 技术博客">
    <meta name="author" content="Reater">
    <meta name="msvalidate.tracking" content="disable">
    <title>Reater02</title>
    
    <!-- 样式表 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Reater02/reater02.github.io@latest/assets/css/onlinewebfonts.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Reater02/reater02.github.io@latest/assets/css/vno.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Reater02/reater02.github.io@latest/assets/css/iconfont.css">
    
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="https://cdn.jsdelivr.net/gh/Reater02/reater02.github.io@latest/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/Reater02/reater02.github.io@latest/favicon.ico">

    <style>
        :root {
            --avatar-size: 120px;
            --social-icon-size: 2rem;
            --main-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }

        .img-placeholder, .ih-item.circle {
            width: var(--avatar-size);
            height: var(--avatar-size);
            border-radius: 50%;
            background: linear-gradient(120deg, #ececec 25%, #f5f5f5 37%, #ececec 63%);
            background-size: 200% 100%;
            animation: placeholder-wave 1.6s ease infinite;
        }

        @keyframes placeholder-wave {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .navigation--social {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 2rem;
        }

        .navigation--social .iconfont {
            font-size: var(--social-icon-size);
            transition: transform 0.3s ease;
        }

        .navigation--social a:hover .iconfont {
            transform: translateY(-3px);
        }

        .panel-cover {
            background: linear-gradient(rgba(0,0,0,0.3), var(--dynamic-bg, var(--main-gradient))) center/cover no-repeat fixed;
            min-height: 100vh;
            transition: background-image 0.8s ease;
        }

        .bg-status {
            position: fixed;
            top: 20px;
            right: 20px;
            color: rgba(255,255,255,0.9);
            padding: 8px 15px;
            background: rgba(0,0,0,0.6);
            border-radius: 20px;
            z-index: 999;
            display: none;
            backdrop-filter: blur(2px);
        }

        .btn-mobile-menu {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(255,255,255,0.9);
            border: none;
            padding: 12px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .btn-mobile-menu:hover {
            transform: scale(1.1);
        }

        .btn-mobile-menu:active {
            transform: scale(0.9);
            transition: transform 0.1s ease;
        }

        @media (max-width: 768px) {
            :root {
                --avatar-size: 100px;
                --social-icon-size: 1.5rem;
            }
            .panel-cover {
                background-attachment: scroll;
            }
            .bg-status {
                font-size: 12px;
                padding: 6px 12px;
            }
            .btn-mobile-menu {
                display: block;
            }
            .navigation-wrapper {
                display: none;
                position: fixed;
                top: 70px;
                left: 0;
                right: 0;
                background: rgba(255,255,255,0.95);
                padding: 20px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            }
            .navigation-wrapper.visible {
                display: block;
                animation: menuSlide 0.3s ease-out;
            }
        }

        @keyframes menuSlide {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .bg-copyright {
            position: fixed;
            bottom: 15px;
            right: 20px;
            color: rgba(255,255,255,0.8);
            font-size: 12px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        @media (prefers-color-scheme: dark) {
            .navigation-wrapper {
                background: rgba(0,0,0,0.95) !important;
            }
        }

        /* 新增优化 */
        html {
            scroll-behavior: smooth;
        }

        .menuSlide {
            will-change: transform, opacity;
        }

        .img-placeholder {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="bg-status" id="bgStatus">🔄 正在加载每日壁纸...</div>
    <button class="btn-mobile-menu icon-list" aria-label="导航菜单"></button>

    <div class="ih-item circle effect right_to_left">
        <a href="#" class="blog-button">
            <div class="img">
                <div class="img-placeholder"></div>
                <img src="https://cdn.jsdelivr.net/gh/Reater02/reater02.github.io@latest/assets/img/personlogo.webp"
                     data-fallback="https://cdn.jsdelivr.net/gh/Reater02/reater02.github.io@latest/assets/img/personlogo.jpg"
                     alt="Reater头像"
                     class="js-avatar iUp profilepic"
                     loading="lazy"
                     decoding="async"
                     width="120"
                     height="120"
                     onerror="this.onerror=null;this.src=this.dataset.fallback">
            </div>
            <div class="info iUp">
                <div class="info-back">
                    <h2>Star</h2>
                    <p>Shine</p>
                </div>
            </div>
        </a>
    </div>

    <h1 class="panel-cover__title panel-title iUp">
        <a href="#">Reater</a>
    </h1>
    <p class="panel-cover__subtitle panel-subtitle iUp">Everything Will Be Better</p>
    <hr class="panel-cover__divider iUp">

    <blockquote class="panel-cover__description iUp" id="hitokoto">
        <p style="display: none">加载中...</p>
        <p>如何得与凉风约，不共尘沙一并来！</p>
        <footer>-「中牟道中」</footer>
    </blockquote>

    <div class="navigation-wrapper iUp">
        <nav class="cover-navigation cover-navigation--primary">
            <ul class="navigation">
                <li class="navigation__item"><a href="/" class="blog-button">首页</a></li>
                <li class="navigation__item"><a href="https://reater.cn:7070/" target="_blank" rel="noopener" class="blog-button">Rcloud</a></li>
                <li class="navigation__item"><a href="https://reater.cn:5001/" target="_blank" rel="noopener" class="blog-button">群晖NAS</a></li>
                <li class="navigation__item"><a href="https://github.com/Reater02/Reater02.github.io" target="_blank" rel="noopener" class="blog-button">关于本站</a></li>
            </ul>
        </nav>

        <nav class="cover-navigation navigation--social">
            <ul class="navigation">
                <li class="navigation__item">
                    <a href="https://github.com/Reater02" target="_blank" rel="noopener" title="GitHub">
                        <i class="social iconfont icon-github"></i>
                    </a>
                </li>
                <li class="navigation__item">
                    <a href="https://www.zhihu.com/people/reater" target="_blank" rel="noopener" title="知乎">
                        <i class="social iconfont icon-zhihu"></i>
                    </a>
                </li>
                <li class="navigation__item">
                    <a href="mailto:601632132@qq.com" title="邮箱">
                        <i class="social iconfont icon-email"></i>
                    </a>
                </li>
            </ul>
        </nav>
    </div>

    <div class="panel-cover--overlay cover-slate"></div>
</body>

<script>
    // iUp动画模块
    var iUp = (function () {
        var time = 0;
        var duration = 150;
        
        return {
            clean: function() { time = 0; },
            up: function(element) {
                setTimeout(function() {
                    element.classList.add("up");
                }, time);
                time += duration;
            },
            down: function(element) {
                element.classList.remove("up");
            },
            toggle: function(element) {
                setTimeout(function() {
                    element.classList.toggle("up");
                }, time);
                time += duration;
            }
        };
    })();

    // 增强的图片加载逻辑
    async function loadBingBackground() {
        const bgStatus = document.getElementById('bgStatus');
        const panel = document.querySelector('#panel');
        const MAX_RETRIES = 3;
        let retryCount = 0;

        async function attemptLoad() {
            try {
                bgStatus.style.display = 'block';
                const proxyUrl = 'https://api.allorigins.win/raw?url=';
                const url = encodeURIComponent('https://www.bing.com/HPImageArchive.aspx?format=js&n=8');
                const jsonResponse = await fetch(proxyUrl + url);
                
                if (!jsonResponse.ok) throw new Error(`HTTP错误 ${jsonResponse.status}`);
                const data = await jsonResponse.json();
                const images = data.images;
                const randomImage = images[Math.floor(Math.random() * images.length)];
                const imgUrl = proxyUrl + encodeURIComponent(`https://www.bing.com${randomImage.url}`);

                await new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => {
                        panel.style.backgroundImage = `url("${imgUrl}")`;
                        resolve();
                    };
                    img.onerror = () => reject(new Error('图片加载失败'));
                    img.src = imgUrl;
                    setTimeout(() => reject('加载超时'), 10000);
                });

                // 添加版权信息
                const copyrightEl = document.createElement('div');
                copyrightEl.className = 'bg-copyright';
                const cleanedCopyright = randomImage.copyright.replace(/(.*?)\s*$.*?$/, '$1');
                copyrightEl.innerHTML = `${cleanedCopyright} (Bing每日壁纸)`;
                document.body.appendChild(copyrightEl);

            } catch (error) {
                if (retryCount < MAX_RETRIES) {
                    retryCount++;
                    return attemptLoad();
                }
                throw error;
            } finally {
                bgStatus.style.display = 'none';
            }
        }

        try {
            await attemptLoad();
        } catch (error) {
            console.warn('使用备用背景:', error);
            panel.style.backgroundImage = 'var(--main-gradient)';
        }
    }
    
    // 优化后的移动端菜单控制
    function initMobileMenu() {
        const btn = document.querySelector('.btn-mobile-menu');
        const nav = document.querySelector('.navigation-wrapper');
        
        if (!btn || !nav) return;

        btn.addEventListener('click', () => {
            const isVisible = nav.classList.contains('visible');
            
            // 使用 CSS 类控制动画
            nav.style.animation = isVisible ? 
                'menuSlide 0.3s ease reverse' : 
                'menuSlide 0.3s ease';
            
            // 切换可见状态
            nav.classList.toggle('visible', !isVisible);
            
            // 控制页面滚动
            document.body.style.overflow = isVisible ? '' : 'hidden';
            
            // 处理动画结束事件
            const handleAnimationEnd = () => {
                nav.removeEventListener('animationend', handleAnimationEnd);
                nav.style.animation = '';
            };
            
            nav.addEventListener('animationend', handleAnimationEnd);
        });
    }

    // 加载一言
    async function loadHitokoto() {
        const target = document.getElementById('hitokoto');
        try {
            const response = await fetch('https://v1.hitokoto.cn');
            if (!response.ok) throw new Error('网络异常');
            const data = await response.json();
            target.innerHTML = `
                <p>${data.hitokoto}</p>
                <footer>-「${data.from}」</footer>
            `;
        } catch (error) {
            target.innerHTML = `
                <p style="color:#999;">加载失败，请稍后再试...</p>
                <p>如何得与凉风约，不共尘沙一并来！</p>
                <footer>-「中牟道中」</footer>
            `;
        }
    }

    // 主初始化
    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('.iUp').forEach(iUp.up);
        loadBingBackground();
        initMobileMenu();
        loadHitokoto();

        // 预加载头像
        const avatarImg = document.querySelector('.js-avatar');
        if (avatarImg) {
            avatarImg.addEventListener('load', () => avatarImg.style.opacity = 1);
            if (avatarImg.complete) avatarImg.style.opacity = 1;
        }
    });
</script>
</html>
