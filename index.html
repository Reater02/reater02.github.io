<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Reater的个人主页">
    <meta name="keywords" content="Reater, 个人主页, 技术博客">
    <meta name="author" content="Reater">
    <title>Reater02</title>
    
    <!-- 样式表 -->
    <link rel="stylesheet" href="https://unpkg.com/dmego-home-page@latest/assets/css/onlinewebfonts.css">
    <link rel="stylesheet" href="https://unpkg.com/dmego-home-page@latest/assets/css/vno.css">
    <link rel="stylesheet" href="https://unpkg.com/dmego-home-page@latest/assets/css/iconfont.css">
    
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="https://unpkg.com/dmego-home-page@latest/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="https://unpkg.com/dmego-home-page@latest/favicon.ico">

    <style>
        /* 基础样式 */
        .img-placeholder {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(120deg, #ececec 25%, #f5f5f5 37%, #ececec 63%);
            background-size: 200% 100%;
            animation: placeholder-wave 1.6s ease infinite;
        }

        @keyframes placeholder-wave {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .ih-item.circle {
            width: 120px;
            height: 120px;
        }

        .navigation--social {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 2rem;
        }

        .navigation--social .iconfont {
            font-size: 2rem;
            transition: transform 0.3s ease;
        }

        .navigation--social a:hover .iconfont {
            transform: translateY(-3px);
        }

        /* 背景图相关样式 */
        .panel-cover {
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), 
                       var(--dynamic-bg, linear-gradient(135deg, #1e3c72 0%, #2a5298 100%)) 
                       center/cover no-repeat fixed;
            min-height: 100vh;
            transition: background-image 0.8s ease;
        }

        .bg-loader {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 999;
        }

        .bg-copyright {
            position: fixed;
            bottom: 15px;
            right: 15px;
            color: rgba(255,255,255,0.8);
            font-size: 0.8em;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
            background: rgba(0,0,0,0.2);
            padding: 4px 8px;
            border-radius: 4px;
            backdrop-filter: blur(2px);
            max-width: 60vw;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .img-placeholder {
                width: 100px;
                height: 100px;
            }
            .ih-item.circle {
                width: 100px;
                height: 100px;
            }
            .navigation--social {
                gap: 1.5rem;
            }
            .panel-cover {
                background-attachment: scroll;
            }
        }
    </style>
</head>

<body>
    <!-- 加载指示器 -->
    <div class="bg-loader" id="bgLoader"></div>

    <!-- 主内容区 -->
    <header id="panel" class="panel-cover">
        <div class="panel-main">
            <div class="panel-main__inner panel-inverted">
                <div class="panel-main__content">
                    <!-- 头像部分 -->
                    <div class="ih-item circle effect right_to_left">
                        <a href="#" class="blog-button">
                            <div class="img">
                                <div class="img-placeholder"></div>
                                <img src="https://cdn.jsdelivr.net/gh/Reater02/reater02.github.io@gh-pages/assets/img/personlogo.webp"
                                    data-fallback="https://cdn.jsdelivr.net/gh/Reater02/reater02.github.io@gh-pages/assets/img/personlogo.jpg"
                                    alt="Reater头像"
                                    class="js-avatar iUp profilepic"
                                    loading="lazy"
                                    width="120"
                                    height="120"
                                    onerror="this.onerror=null;this.src=this.dataset.fallback">
                            </div>
                            <div class="info iUp">
                                <div class="info-back">
                                    <h2>Star</h2>
                                    <p>Shine</p>
                                </div>
                            </div>
                        </a>
                    </div>

                    <!-- 标题区 -->
                    <h1 class="panel-cover__title panel-title iUp">
                        <a href="#">Reater</a>
                    </h1>
                    <p class="panel-cover__subtitle panel-subtitle iUp">Everything Will Be Better</p>
                    <hr class="panel-cover__divider iUp">

                    <!-- 诗句引用 -->
                    <blockquote class="panel-cover__description iUp">
                        <p>如何得与凉风约，不共尘沙一并来！</p>
                        <footer>-「中牟道中」</footer>
                    </blockquote>

                    <!-- 导航菜单 -->
                    <div class="navigation-wrapper iUp">
                        <nav class="cover-navigation cover-navigation--primary">
                            <ul class="navigation">
                                <li class="navigation__item"><a href="/" class="blog-button">首页</a></li>
                                <li class="navigation__item"><a href="https://reater.cn:7070/" target="_blank" rel="noopener noreferrer" class="blog-button">Rcloud</a></li>
                                <li class="navigation__item"><a href="https://reater.cn:5001/" target="_blank" rel="noopener noreferrer" class="blog-button">群晖NAS</a></li>
                                <li class="navigation__item"><a href="https://github.com/Reater02/Reater02.github.io" target="_blank" rel="noopener noreferrer" class="blog-button">关于本站</a></li>
                            </ul>
                        </nav>

                        <!-- 社交链接 -->
                        <nav class="cover-navigation navigation--social">
                            <ul class="navigation">
                                <li class="navigation__item">
                                    <a href="https://github.com/Reater02" target="_blank" rel="noopener noreferrer" title="GitHub">
                                        <i class="social iconfont icon-github"></i>
                                    </a>
                                </li>
                                <li class="navigation__item">
                                    <a href="https://www.zhihu.com/people/reater" target="_blank" rel="noopener noreferrer" title="知乎">
                                        <i class="social iconfont icon-zhihu"></i>
                                    </a>
                                </li>
                                <li class="navigation__item">
                                    <a href="mailto:601632132@qq.com" title="邮箱">
                                        <i class="social iconfont icon-email"></i>
                                    </a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
            <div class="panel-cover--overlay cover-slate"></div>
        </div>

        <!-- 页脚 -->
        <div class="remark iUp">
            <p class="power">
                Powered by 
                <a href="https://hitokoto.cn/" target="_blank" rel="noopener noreferrer">Hitokoto</a> 
                & 
                <a href="https://www.jsdelivr.com/" target="_blank" rel="noopener noreferrer">jsDelivr</a>
            </p>
        </div>
    </header>

    <!-- 脚本 -->
    <script src="https://unpkg.com/dmego-home-page@latest/assets/js/main.js"></script>
    <script>
        // 动态加载背景图
        (async function() {
            const bgLoader = document.getElementById('bgLoader');
            const header = document.querySelector('.panel-cover');
            let copyrightEl = null;

            try {
                // 显示加载动画
                bgLoader.style.opacity = '1';
                
                // 获取图片数据
                const response = await fetch('/assets/json/images.json?t=' + Date.now());
                const jsonText = await response.text();
                
                // 解析JSONP格式数据
                const imgPaths = JSON.parse(jsonText.match(/$$.*?$$/s)[0]);
                if (!Array.isArray(imgPaths)) throw new Error('Invalid data format');
                
                // 随机选择图片
                const randomIndex = Math.floor(Math.random() * imgPaths.length);
                const imgUrl = 'https://www.bing.com' + imgPaths[randomIndex];
                
                // 预加载图片
                await new Promise((resolve, reject) => {
                    const img = new Image();
                    img.src = imgUrl;
                    img.onload = resolve;
                    img.onerror = reject;
                    setTimeout(() => reject('加载超时'), 10000);
                });

                // 应用背景
                header.style.setProperty('--dynamic-bg', `url(${imgUrl})`);
                
                // 添加版权信息
                copyrightEl = document.createElement('div');
                copyrightEl.className = 'bg-copyright';
                copyrightEl.textContent = 'Bing每日壁纸';
                document.body.appendChild(copyrightEl);

            } catch (error) {
                console.error('背景加载失败:', error);
                // 保持默认渐变背景
            } finally {
                // 隐藏加载动画
                bgLoader.style.opacity = '0';
                setTimeout(() => bgLoader.remove(), 300);
            }
        })();

        // 图片加载监控
        document.querySelectorAll('img[loading="lazy"]').forEach(img => {
            const loadHandler = () => img.style.opacity = 1;
            
            if (img.complete) {
                loadHandler();
            } else {
                img.addEventListener('load', loadHandler);
                img.addEventListener('error', () => {
                    if (img.dataset.fallback) {
                        img.src = img.dataset.fallback;
                    }
                });
            }
        });
    </script>
</body>
</html>
