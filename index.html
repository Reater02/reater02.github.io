    <style>
        /* 新增头像动画容器样式 */
        .avatar-container {
            position: relative;
            width: 120px;
            height: 120px;
            perspective: 1000px;
            margin: 0 auto;
        }

        /* 头像浮动动画 */
        @keyframes avatar-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* 动态调整的iUp动画 */
        .iUp.animated-avatar {
            animation: avatar-float 3s ease-in-out infinite;
            transform-style: preserve-3d;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 头像图片样式 */
        .js-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            position: relative;
            z-index: 2;
            backface-visibility: hidden;
        }

        /* 原样式保持 */
        .img-placeholder {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(120deg, #ececec 25%, #f5f5f5 37%, #ececec 63%);
            background-size: 200% 100%;
            animation: placeholder-wave 1.6s ease infinite;
            z-index: 1;
        }

        /* 其他原有样式保持不变... */
    </style>
</head>

<body>

                                    height="120"
                                    onerror="this.onerror=null;this.src=this.dataset.fallback">

        <!-- 页脚 -->

    <!-- 脚本 -->
<script>
        // ================== 增强版iUp动画模块 ==================
        const iUp = (function () {
            let time = 0;
            const duration = 150;
            
            return {
                clean: () => time = 0,
                up: (element) => {
                    element.style.transform = 'translateY(-20px)';
                    element.style.opacity = '1';
                    element.style.transition = `all ${duration}ms cubic-bezier(0.4, 0, 0.2, 1)`;
                    time += duration;
                },
                down: (element) => {
                    element.style.transform = 'translateY(0)';
                    element.style.opacity = '0';
                },
                toggle: (element) => {
                    const isUp = element.style.transform === 'translateY(-20px)';
                    element.style.transform = isUp ? 'translateY(0)' : 'translateY(-20px)';
                    element.style.opacity = isUp ? '0' : '1';
                }
            };
        })();

        // ================== 初始化逻辑 ==================
        document.addEventListener('DOMContentLoaded', () => {
            // 初始化头像动画
            const avatarContainer = document.querySelector('.animated-avatar');
            if (avatarContainer) {
                iUp.up(avatarContainer);
                
                // 添加悬停效果
                avatarContainer.addEventListener('mouseenter', () => {
                    avatarContainer.style.transform = 'translateY(-20px) scale(1.05)';
                });
                avatarContainer.addEventListener('mouseleave', () => {
                    avatarContainer.style.transform = 'translateY(-20px) scale(1)';
                });
            }

    // ================== 背景加载模块（增强版） ==================
    async function loadBingBackground() {
        const bgStatus = document.getElementById('bgStatus');
        const panel = document.querySelector('#panel');
        
        try {
            // 显示加载状态
            bgStatus.style.display = 'block';
            
            // 获取并处理JSON数据
            const response = await fetch('/assets/json/images.json');
            if (!response.ok) throw new Error(`HTTP错误 ${response.status}`);
            
            const jsonText = await response.text();
            
            // 精准提取JSON数组（处理JSONP格式）
            const jsonString = jsonText
                .replace(/^[^{[]*/, '')  // 移除非JSON前缀
                .replace(/[^}\]]*$/, '') // 移除非JSON后缀
                .replace(/'/g, '"');     // 统一引号格式
                
            const imgUrls = JSON.parse(jsonString);
            
            // 随机选择图片
            const randomIndex = Math.floor(Math.random() * imgUrls.length);
            const imgPath = imgUrls[randomIndex];
            const imgUrl = `https://www.bing.com${imgPath}`;

            // 创建测试图片（带跨域处理）
            const img = new Image();
            img.crossOrigin = "anonymous";
            
            await new Promise((resolve, reject) => {
                img.onload = () => {
                    panel.style.backgroundImage = `url(${imgUrl})`;
                    resolve();
                };
                img.onerror = () => reject(new Error('跨域加载被阻止'));
                img.src = imgUrl;
                setTimeout(() => reject('加载超时（10秒）'), 10000);
            });

            // 添加版权信息
            const copyrightMatch = imgPath.match(/OHR\.(\w+?)_/);
            if (copyrightMatch) {
                const copyrightEl = document.createElement('div');
                copyrightEl.className = 'bg-copyright';
                copyrightEl.textContent = copyrightMatch[1]
                    .replace(/([A-Z])/g, ' $1')
                    .trim() + ' (Bing每日壁纸)';
                document.body.appendChild(copyrightEl);
            }

        } catch (error) {
            console.error('背景加载失败:', error);
            // 降级到默认背景
            panel.style.backgroundImage = 'linear-gradient(135deg, #1e3c72 0%, #2a5298 100%)';
        } finally {
            bgStatus.style.display = 'none';
        }
    }

    // ================== 移动端菜单（稳定版） ==================
    function initMobileMenu() {
        const btn = document.querySelector('.btn-mobile-menu');
        const nav = document.querySelector('.navigation-wrapper');
        
        if (!btn || !nav) return;

        let isAnimating = false;
        
        btn.addEventListener('click', () => {
            if (isAnimating) return;
            
            const isVisible = nav.classList.contains('visible');
            const animationType = isVisible ? 'bounceOutUp' : 'bounceInDown';
            
            // 动画开始标记
            isAnimating = true;
            nav.classList.add('animated', animationType);
            
            // 动画结束处理
            const cleanup = () => {
                nav.classList.remove('animated', animationType);
                nav.classList.toggle('visible', !isVisible);
                isAnimating = false;
            };
            
            // 按钮图标切换
            btn.classList.toggle('icon-angleup');
            btn.classList.toggle('icon-list');
            
            // 监听动画结束
            nav.addEventListener('animationend', cleanup, { once: true });
        });
    }

    // ================== 主初始化逻辑 ==================
    document.addEventListener('DOMContentLoaded', function () {
        // 初始化动画
        document.querySelectorAll('.iUp').forEach(element => {
            iUp.up(element);
        });

        // 加载背景
        loadBingBackground();

        // 初始化移动端菜单
        initMobileMenu();

        // 加载Hitokoto
        fetch('https://v1.hitokoto.cn')
            .then(response => response.json())
            .then(data => {
                const target = document.getElementById('hitokoto');
                if (target) {
                    target.innerHTML = `${data.hitokoto}<br/><footer>-「${data.from}」</footer>`;
                }
            })
            .catch(error => console.error('一言加载失败:', error));

        // 头像加载处理
        const avatar = document.querySelector('.js-avatar');
        if (avatar) {
            avatar.addEventListener('load', function () {
                this.style.opacity = 1;
            });
            if (avatar.complete) avatar.style.opacity = 1;
        }
    });
</script>
