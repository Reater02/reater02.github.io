<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Reater的个人主页">
    <meta name="keywords" content="Reater, 个人主页, 技术博客">
    <meta name="author" content="Reater">
    <title>Reater02</title>
    
    <!-- 样式表 -->
    <link rel="stylesheet" href="https://raw.githubusercontent.com/Reater02/reater02.github.io/493df04ee51240174838c80fdafe5a020f3d9c13/assets/css/onlinewebfonts.css">
    <link rel="stylesheet" href="https://raw.githubusercontent.com/Reater02/reater02.github.io/493df04ee51240174838c80fdafe5a020f3d9c13/assets/css/vno.css">
    <link rel="stylesheet" href="https://raw.githubusercontent.com/Reater02/reater02.github.io/493df04ee51240174838c80fdafe5a020f3d9c13/assets/css/iconfont.css">
    
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/Reater02/reater02.github.io/493df04ee51240174838c80fdafe5a020f3d9c13/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Reater02/reater02.github.io/493df04ee51240174838c80fdafe5a020f3d9c13/favicon.ico">

    <style>
        /* 基础样式 */
        .img-placeholder {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(120deg, #ececec 25%, #f5f5f5 37%, #ececec 63%);
            background-size: 200% 100%;
            animation: placeholder-wave 1.6s ease infinite;
        }

        @keyframes placeholder-wave {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .ih-item.circle {
            width: 120px;
            height: 120px;
        }

        .navigation--social {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 2rem;
        }

        .navigation--social .iconfont {
            font-size: 2rem;
            transition: transform 0.3s ease;
        }

        .navigation--social a:hover .iconfont {
            transform: translateY(-3px);
        }

        /* 背景图相关样式 */
        .panel-cover {
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), 
                       var(--dynamic-bg, linear-gradient(135deg, #1e3c72 0%, #2a5298 100%)) 
                       center/cover no-repeat fixed;
            min-height: 100vh;
            transition: background-image 0.8s ease;
        }

        /* 加载状态指示器 */
        .bg-status {
            position: fixed;
            top: 20px;
            right: 20px;
            color: rgba(255,255,255,0.9);
            padding: 8px 15px;
            background: rgba(0,0,0,0.6);
            border-radius: 20px;
            z-index: 999;
            display: none;
        }

        @media (max-width: 768px) {
            .img-placeholder {
                width: 100px;
                height: 100px;
            }
            .ih-item.circle {
                width: 100px;
                height: 100px;
            }
            .navigation--social {
                gap: 1.5rem;
            }
            .panel-cover {
                background-attachment: scroll;
            }
        }
    </style>
</head>

<body>
    <!-- 加载状态提示 -->
    <div class="bg-status" id="bgStatus">🔄 正在加载每日壁纸...</div>

    <!-- 主内容区 -->
    <header id="panel" class="panel-cover">
        <!-- 保持原有内容结构不变 -->
        <!-- ... 其他页面内容保持不变 ... -->
    </header>

    <!-- 脚本 -->
    <script src="https://raw.githubusercontent.com/Reater02/reater02.github.io/493df04ee51240174838c80fdafe5a020f3d9c13/assets/js/main.js"></script>
    
    <script>
        // 动态加载背景图
        (async function() {
            const bgStatus = document.getElementById('bgStatus');
            const panel = document.querySelector('#panel');
            
            try {
                bgStatus.style.display = 'block';
                
                const response = await fetch('/assets/json/images.json');
                const jsonText = await response.text();
                
                // 解析JSONP格式数据
                const jsonString = jsonText
                    .replace(/^getBingImages$/, '')
                    .replace(/$;?\s*$/, '');
                const imgUrls = JSON.parse(jsonString);

                // 随机选择图片
                const randomIndex = Math.floor(Math.random() * imgUrls.length);
                const imgUrl = `https://www.bing.com${imgUrls[randomIndex]}`;

                // 预加载验证
                await new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = resolve;
                    img.onerror = reject;
                    img.src = imgUrl;
                    setTimeout(() => reject('加载超时'), 10000);
                });

                panel.style.backgroundImage = `url(${imgUrl})`;

            } catch (error) {
                console.error('背景加载失败:', error);
                panel.style.backgroundImage = 'linear-gradient(135deg, #1e3c72 0%, #2a5298 100%)';
            } finally {
                bgStatus.style.display = 'none';
            }
        })();
    </script>
</body>
</html>
