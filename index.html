    <style>
        :root {
            --avatar-size: 120px;
            --social-icon-size: 2rem;
            --main-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }

        .img-placeholder, .ih-item.circle {
            width: var(--avatar-size);
            height: var(--avatar-size);
            border-radius: 50%;
            background: linear-gradient(120deg, #ececec 25%, #f5f5f5 37%, #ececec 63%);
            background-size: 200% 100%;
            animation: placeholder-wave 1.6s ease infinite;
        }

        @keyframes placeholder-wave {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .navigation--social {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 2rem;
        }

        .navigation--social .iconfont {
            font-size: var(--social-icon-size);
            transition: transform 0.3s ease;
        }

        .navigation--social a:hover .iconfont {
            transform: translateY(-3px);
        }

        .panel-cover {
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), 
                       var(--dynamic-bg, var(--main-gradient)) center/cover no-repeat fixed;
            min-height: 100vh;
            transition: background-image 0.8s ease;
        }

        .bg-status {
            position: fixed;
            top: 20px;
            right: 20px;
            color: rgba(255,255,255,0.9);
            padding: 8px 15px;
            background: rgba(0,0,0,0.6);
            border-radius: 20px;
            z-index: 999;
            display: none;
            backdrop-filter: blur(2px);
        }

            .btn-mobile-menu {
        display: none;
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 1000;
        background: rgba(255,255,255,0.9);
        border: none;
        padding: 12px;
        border-radius: 50%;
        cursor: pointer;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        transition: transform 0.3s ease;
    }

    .btn-mobile-menu:hover {
        transform: scale(1.1);
    }
        
       @media (max-width: 768px) {
    :root {
        --avatar-size: 100px;
        --social-icon-size: 1.5rem;
    }
    .panel-cover {
        background-attachment: scroll;
    }
    .bg-status {
        font-size: 12px;
        padding: 6px 12px;
    }
    
    /* 移动端菜单按钮显示 */
    .btn-mobile-menu {
        display: block;
    }
    
    /* 导航菜单样式 */
    .navigation-wrapper {
        display: none;
        position: fixed;
        top: 70px;
        left: 0;
        right: 0;
        background: rgba(255,255,255,0.95);
        padding: 20px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
           
    .btn-mobile-menu:active {
    transform: scale(0.9);
    transition: transform 0.1s ease;
}
    .navigation-wrapper.visible {
        display: block;
        animation: menuSlide 0.3s ease-out;
    }
} /* 添加闭合括号 */
        

/* 动画定义应放在媒体查询外部 */
@keyframes menuSlide {
    from { transform: translateY(-20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}
    </style>
</head>

<body>

                    <div class="navigation-wrapper iUp">
                        <nav class="cover-navigation cover-navigation--primary">

                                <li class="navigation__item"><a href="https://reater.cn:7070/" target="_blank" rel="noopener" class="blog-button">Rcloud</a></li>
                                <li class="navigation__item"><a href="https://reater.cn:5001/" target="_blank" rel="noopener" class="blog-button">群晖NAS</a></li>
                                <li class="navigation__item"><a href="https://github.com/Reater02/Reater02.github.io" target="_blank" rel="noopener" class="blog-button">关于本站</a></li>

                        <nav class="cover-navigation navigation--social">

                    </div>
                </div>
            </div>

        <div class="remark iUp">

                Powered by 
                <a href="https://hitokoto.cn/" target="_blank" rel="noopener">Hitokoto</a>

  <script>
    // ====== 修复后的iUp模块 ======
   var iUp = (function () {
        var time = 0;
        var duration = 150;
        
        return {
            clean: function() { 
                time = 0; 
            },
            up: function(element) {
                setTimeout(function() {
                    element.classList.add("up");
                }, time);
                time += duration;
            },
            down: function(element) {
                element.classList.remove("up");
            },
            toggle: function(element) {
                setTimeout(function() {
                    element.classList.toggle("up");
                }, time);
                time += duration;
            }
        };
    })();

         // 增强的图片加载逻辑
    async function loadBingBackground() {
        const bgStatus = document.getElementById('bgStatus');
        const panel = document.querySelector('#panel');
        
        try {
            bgStatus.style.display = 'block';
            
            // 使用更可靠的CORS代理
            const proxyUrl = 'https://api.allorigins.win/raw?url=';
            const jsonResponse = await fetch(proxyUrl + encodeURIComponent('https://www.bing.com/HPImageArchive.aspx?format=js&n=8'));
            
            if (!jsonResponse.ok) throw new Error('数据加载失败');
            const data = await jsonResponse.json();
            
            const images = data.images;
            const randomImage = images[Math.floor(Math.random() * images.length)];
            const imgUrl = proxyUrl + encodeURIComponent(`https://www.bing.com${randomImage.url}`);

            await new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    panel.style.backgroundImage = `url("${imgUrl}")`;
                    resolve();
                };
                img.onerror = () => reject(new Error('图片加载失败'));
                img.src = imgUrl;
                setTimeout(() => reject('加载超时（10秒）'), 10000);
            });

            // 添加版权信息
            const copyrightEl = document.createElement('div');
            copyrightEl.className = 'bg-copyright';
            copyrightEl.innerHTML = `${randomImage.copyright} (Bing每日壁纸)`;
            document.body.appendChild(copyrightEl);

        } catch (error) {
            console.warn('使用备用背景:', error);
            panel.style.backgroundImage = 'var(--main-gradient)';
        } finally {
            bgStatus.style.display = 'none';
        }
    }

    // 优化懒加载处理
    document.addEventListener('DOMContentLoaded', function () {
        // 预加载关键图片
        const avatar = new Image();
        avatar.src = document.querySelector('.js-avatar').src;
    });
      
         // 优化后的移动端菜单函数
        function initMobileMenu() {
            const btn = document.querySelector('.btn-mobile-menu');
            const nav = document.querySelector('.navigation-wrapper');
            
            if (!btn || !nav) {
                console.warn('缺少移动端菜单元素');
                return;
            }

            btn.addEventListener('click', () => {
                const isVisible = nav.classList.contains('visible');
                const animationType = isVisible ? 'fadeOutUp' : 'fadeInDown';
                
                // 添加动画类
            nav.style.animation = 'menuSlide 0.3s ease-out';
                
                // 动画结束后处理
                nav.addEventListener('animationend', () => {
                    nav.classList.remove('animate__animated', `animate__${animationType}`);
                    nav.classList.toggle('visible', !isVisible);
                    
                    // 更新按钮图标
                    btn.classList.toggle('icon-angleup');
                    btn.classList.toggle('icon-list');
                }, { once: true });
            });
        }


        // 主初始化
         document.addEventListener('DOMContentLoaded', function () {
        // 初始化动画
        document.querySelectorAll('.iUp').forEach(element => {
            iUp.up(element);
        });

        // 加载背景
        loadBingBackground();

        // 初始化移动端菜单
        initMobileMenu();

        // 预加载头像
        const avatar = new Image();
        const avatarElement = document.querySelector('.js-avatar');
        if(avatarElement) {
            avatar.src = avatarElement.src;
        }

        // 加载一言
        fetch('https://v1.hitokoto.cn')
            .then(response => {
                if (!response.ok) throw new Error('网络响应异常');
                return response.json();
            })
            .then(data => {
                const target = document.getElementById('hitokoto');
                if (target) {
                    target.innerHTML = `${data.hitokoto}<br/><footer>-「${data.from}」</footer>`;
                }
            })
            .catch(() => {
                const defaultQuote = document.getElementById('hitokoto');
                defaultQuote.innerHTML = `<p>如何得与凉风约，不共尘沙一并来！</p><footer>-「中牟道中」</footer>`;
            });

        // 头像加载处理
        const avatarImg = document.querySelector('.js-avatar');
        if (avatarImg) {
            avatarImg.addEventListener('load', () => avatarImg.style.opacity = 1);
            if (avatarImg.complete) avatarImg.style.opacity = 1;
        }
    });
    </script>
</body>
