    <style>
        /* 新增移动端遮罩层样式 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 999;
            display: none;
        }

        /* 新增动画关键帧 */
        @keyframes bounceInDown {
            0% {
                transform: translateY(-100%);
                opacity: 0;
            }
            80% {
                transform: translateY(0);
                opacity: 1;
            }
            to {
                transform: translateY(5px);
                opacity: 1;
            }
        }

        @keyframes bounceOutUp {
            0% {
                transform: translateY(0);
                opacity: 1;
            }
            20% {
                transform: translateY(-5px);
                opacity: 1;
            }
            100% {
                transform: translateY(-100%);
                opacity: 0;
            }
        }

        .animated {
            animation-duration: 0.8s;
            animation-timing-function: cubic-bezier(0.2, 0.5, 0.5, 1);
            animation-fill-mode: both;
        }

        /* 其他原有样式保持不变... */
    </style>

    <!-- 脚本 -->
    <script>
        // ...原有脚本代码...

        // 修改后的移动端菜单逻辑
        function initMobileMenu() {
            const btn = document.querySelector('.btn-mobile-menu');
            const nav = document.querySelector('.navigation-wrapper');
            const overlay = document.createElement('div');
            overlay.className = 'overlay';
            document.body.appendChild(overlay);

            if (!btn || !nav) return;

            let isAnimating = false;
            
            btn.addEventListener('click', () => {
                if (isAnimating) return;
                
                const isVisible = nav.classList.contains('visible');
                const animationType = isVisible ? 'bounceOutUp' : 'bounceInDown';
                
                // 切换遮罩层显示状态
                overlay.style.display = isVisible ? 'none' : 'block';
                
                // 添加动画类
                nav.classList.add('animated', animationType);
                
                isAnimating = true;
                
                // 更新按钮图标
                btn.classList.toggle('icon-angleup');
                btn.classList.toggle('icon-list');
                
                // 动画完成回调
                const cleanup = () => {
                    nav.classList.remove('animated', animationType);
                    nav.classList.toggle('visible', !isVisible);
                    isAnimating = false;
                    
                    // 动画完成后隐藏遮罩层（如果菜单已关闭）
                    if (!nav.classList.contains('visible')) {
                        overlay.style.display = 'none';
                    }
                };
                
                // 监听动画结束
                nav.addEventListener('animationend', cleanup, { once: true });
            });
        }

        // ...其他原有脚本代码...
    </script>
