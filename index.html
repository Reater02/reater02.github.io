<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <!-- 保持原有meta和link部分不变 -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Reater的个人主页">
    <meta name="keywords" content="Reater, 个人主页, 技术博客">
    <meta name="author" content="Reater">
    <title>Reater02</title>
    
    <!-- 样式表 -->
    <link rel="stylesheet" href="https://unpkg.com/dmego-home-page@latest/assets/css/onlinewebfonts.css">
    <link rel="stylesheet" href="https://unpkg.com/dmego-home-page@latest/assets/css/vno.css">
    <link rel="stylesheet" href="https://unpkg.com/dmego-home-page@latest/assets/css/iconfont.css">
    
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="https://unpkg.com/dmego-home-page@latest/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="https://unpkg.com/dmego-home-page@latest/favicon.ico">

    <style>
        /* 原有样式保持不变 */
        .img-placeholder {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(120deg, #ececec 25%, #f5f5f5 37%, #ececec 63%);
            background-size: 200% 100%;
            animation: placeholder-wave 1.6s ease infinite;
        }

        @keyframes placeholder-wave {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .ih-item.circle {
            width: 120px;
            height: 120px;
        }

        .navigation--social {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 2rem;
        }

        .navigation--social .iconfont {
            font-size: 2rem;
            transition: transform 0.3s ease;
        }

        .navigation--social a:hover .iconfont {
            transform: translateY(-3px);
        }

        /* 更新背景图样式 */
        .panel-cover {
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), 
                       var(--dynamic-bg, linear-gradient(135deg, #1e3c72 0%, #2a5298 100%)) 
                       center/cover no-repeat fixed;
            min-height: 100vh;
            transition: background-image 0.8s ease;
        }

        .bg-loader {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 999;
        }

        .bg-copyright {
            position: fixed;
            bottom: 15px;
            right: 15px;
            color: rgba(255,255,255,0.8);
            font-size: 0.8em;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
            background: rgba(0,0,0,0.2);
            padding: 4px 8px;
            border-radius: 4px;
            backdrop-filter: blur(2px);
            max-width: 60vw;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .img-placeholder {
                width: 100px;
                height: 100px;
            }
            .ih-item.circle {
                width: 100px;
                height: 100px;
            }
            .navigation--social {
                gap: 1.5rem;
            }
            .panel-cover {
                background-attachment: scroll;
            }
        }
    </style>
</head>

<body>
    <!-- 加载指示器 -->
    <div class="bg-loader" id="bgLoader"></div>

    <!-- 主内容区（保持原有结构不变） -->
    <header id="panel" class="panel-cover">
        <!-- 原有header内容保持不变 -->
    </header>

    <!-- 脚本 -->
    <script src="https://unpkg.com/dmego-home-page@latest/assets/js/main.js"></script>
    <script>
        // 动态加载背景图（修正版）
        (async function() {
            const bgLoader = document.getElementById('bgLoader');
            const header = document.querySelector('.panel-cover');
            
            try {
                // 显示加载动画
                bgLoader.style.opacity = '1';
                
                // 获取并处理JSONP数据
                const response = await fetch('/assets/json/images.json?t=' + Date.now());
                const jsonText = await response.text();
                
                // 修正正则表达式提取数组
                const jsonArray = JSON.parse(
                    jsonText
                        .replace(/^getBingImages$/, '')
                        .replace(/$;?\s*$/, '')
                );

                // 随机选择图片并生成有效URL
                const randomPath = jsonArray[Math.floor(Math.random() * jsonArray.length)];
                const imgUrl = `https://www.bing.com${randomPath}`;
                
                // 预加载图片
                await new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = resolve;
                    img.onerror = () => reject(new Error('图片加载失败'));
                    img.src = imgUrl;
                    setTimeout(() => reject('加载超时'), 10000);
                });

                // 应用背景
                header.style.setProperty('--dynamic-bg', `url(${imgUrl})`);

                // 生成可读的版权信息
                const copyrightMatch = randomPath.match(/OHR\.(\w+?)_/);
                const copyrightText = copyrightMatch 
                    ? `${copyrightMatch[1].replace(/([A-Z])/g, ' $1').trim()} (Bing每日壁纸)`
                    : 'Bing每日壁纸';

                // 添加版权信息
                const copyrightEl = document.createElement('div');
                copyrightEl.className = 'bg-copyright';
                copyrightEl.textContent = copyrightText;
                document.body.appendChild(copyrightEl);

            } catch (error) {
                console.error('背景加载失败:', error);
                // 显示错误提示
                const errorEl = document.createElement('div');
                errorEl.className = 'bg-copyright';
                errorEl.style.color = '#ff6666';
                errorEl.textContent = '背景加载失败，已显示默认背景';
                document.body.appendChild(errorEl);
                
            } finally {
                // 隐藏加载动画
                bgLoader.style.opacity = '0';
                setTimeout(() => bgLoader.remove(), 1000);
            }
        })();

        // 图片加载监控（保持原有逻辑）
        document.querySelectorAll('img[loading="lazy"]').forEach(img => {
            const loadHandler = () => img.style.opacity = 1;
            
            if (img.complete) {
                loadHandler();
            } else {
                img.addEventListener('load', loadHandler);
                img.addEventListener('error', () => {
                    if (img.dataset.fallback) {
                        img.src = img.dataset.fallback;
                    }
                });
            }
        });
    </script>
</body>
</html>
