<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Reater的个人主页，分享前端开发、项目经验和技术博客。">
    <meta name="keywords" content="Reater, 前端开发, 技术博客, 项目分享, JavaScript, CSS">
    <meta name="author" content="Reater">
    
    <!-- 预加载优化 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://api.allorigins.win">
    <link rel="dns-prefetch" href="https://api.allorigins.win">

    <!-- 样式表 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Reater02/reater02.github.io@latest/assets/css/onlinewebfonts.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Reater02/reater02.github.io@latest/assets/css/vno.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Reater02/reater02.github.io@latest/assets/css/iconfont.css">
    
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="https://cdn.jsdelivr.net/gh/Reater02/reater02.github.io@latest/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/Reater02/reater02.github.io@latest/favicon.ico">

    <style>
        :root {
            --avatar-size: 120px;
            --social-icon-size: 2rem;
            --main-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }

        /* 优化后的动画效果 */
        .iUp {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s cubic-bezier(0.22, 0.61, 0.36, 1);
        }
        .iUp.up {
            opacity: 1;
            transform: translateY(0);
        }

        .img-placeholder {
            width: var(--avatar-size);
            height: var(--avatar-size);
            border-radius: 50%;
            background: linear-gradient(120deg, #ececec 25%, #f5f5f5 37%, #ececec 63%);
            background-size: 200% 100%;
            animation: placeholder-wave 1.6s ease infinite;
        }

        @keyframes placeholder-wave {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .navigation--social {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 2rem;
        }

        .navigation--social .iconfont {
            font-size: var(--social-icon-size);
            transition: transform 0.3s ease;
        }

        .navigation--social a:hover .iconfont {
            transform: translateY(-3px);
        }

        .panel-cover {
            background: linear-gradient(rgba(0,0,0,0.3), var(--dynamic-bg, var(--main-gradient))) center/cover no-repeat fixed;
            min-height: 100vh;
            transition: background-image 0.8s ease;
        }

        .bg-status {
            position: fixed;
            top: 20px;
            right: 20px;
            color: rgba(255,255,255,0.9);
            padding: 8px 15px;
            background: rgba(0,0,0,0.6);
            border-radius: 20px;
            z-index: 999;
            display: none;
            backdrop-filter: blur(2px);
        }

        .btn-mobile-menu {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(255,255,255,0.9);
            border: none;
            padding: 12px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        @media (max-width: 768px) {
            :root {
                --avatar-size: 100px;
                --social-icon-size: 1.5rem;
            }
            .btn-mobile-menu {
                display: block;
            }
            .navigation-wrapper {
                display: none;
                position: fixed;
                top: 70px;
                left: 0;
                right: 0;
                background: rgba(0,0,0,0.95);
                padding: 20px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            }
            .navigation-wrapper.visible {
                display: block;
                animation: menuSlide 0.3s ease-out;
            }
        }

        @keyframes menuSlide {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .avatar-wrapper {
            width: var(--avatar-size);
            height: var(--avatar-size);
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            margin-bottom: 20px;
        }

        .js-avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="bg-status" id="bgStatus">🔄 正在加载每日壁纸...</div>
    <button class="btn-mobile-menu icon-list" aria-label="导航菜单"></button>

    <div class="ih-item circle effect right_to_left">
        <a href="#" class="blog-button">
            <div class="avatar-wrapper">
                <div class="img-placeholder"></div>
                <img src="https://cdn.jsdelivr.net/gh/Reater02/reater02.github.io@latest/assets/img/personlogo.webp"
                     data-fallback="https://cdn.jsdelivr.net/gh/Reater02/reater02.github.io@latest/assets/img/personlogo.jpg"
                     alt="Reater头像"
                     class="js-avatar"
                     loading="eager"
                     decoding="async"
                     width="120"
                     height="120"
                     onerror="this.onerror=null;this.src=this.dataset.fallback">
            </div>
            
            <div class="info iUp">
                <div class="info-back">
                    <h2>Star</h2>
                    <p>Shine</p>
                </div>
            </div>
        </a>
    </div>

    <h1 class="panel-cover__title panel-title iUp">
        <a href="#">Reater</a>
    </h1>
    <p class="panel-cover__subtitle panel-subtitle iUp">Everything Will Be Better</p>
    <hr class="panel-cover__divider iUp">

    <blockquote class="panel-cover__description iUp" id="hitokoto">
        <p>如何得与凉风约，不共尘沙一并来！</p>
        <footer>-「中牟道中」</footer>
    </blockquote>

    <div class="navigation-wrapper iUp">
        <nav class="cover-navigation cover-navigation--primary">
            <ul class="navigation">
                <li class="navigation__item"><a href="/" class="blog-button">首页</a></li>
                <li class="navigation__item"><a href="https://reater.cn:7070/" target="_blank" rel="noopener" class="blog-button">Rcloud</a></li>
                <li class="navigation__item"><a href="https://reater.cn:5001/" target="_blank" rel="noopener" class="blog-button">群晖NAS</a></li>
                <li class="navigation__item"><a href="https://github.com/Reater02/Reater02.github.io" target="_blank" rel="noopener" class="blog-button">关于本站</a></li>
            </ul>
        </nav>

        <nav class="cover-navigation navigation--social">
            <ul class="navigation">
                <li class="navigation__item">
                    <a href="https://github.com/Reater02" target="_blank" rel="noopener" aria-label="GitHub">
                        <i class="social iconfont icon-github"></i>
                    </a>
                </li>
                <li class="navigation__item">
                    <a href="https://www.zhihu.com/people/reater" target="_blank" rel="noopener" aria-label="知乎">
                        <i class="social iconfont icon-zhihu"></i>
                    </a>
                </li>
                <li class="navigation__item">
                    <a href="mailto:601632132@qq.com" aria-label="邮箱">
                        <i class="social iconfont icon-email"></i>
                    </a>
                </li>
            </ul>
        </nav>
    </div>

    <div class="panel-cover--overlay cover-slate"></div>

<script>
    // 初始化动画
    document.querySelectorAll('.iUp').forEach(el => {
        setTimeout(() => el.classList.add('up'), 100);
    });

    // 增强的背景加载逻辑
    async function loadBingBackground() {
        const bgStatus = document.getElementById('bgStatus');
        const panel = document.querySelector('.panel-cover');
        const MAX_RETRIES = 3;
        let retryCount = 0;

        // 检查缓存
        const today = new Date().toDateString();
        const cachedBg = localStorage.getItem('bingBg');
        if (cachedBg) {
            const { date, url } = JSON.parse(cachedBg);
            if (date === today) {
                panel.style.backgroundImage = `url("${url}")`;
                return;
            }
        }

        async function attemptLoad() {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 10000);

            try {
                bgStatus.style.display = 'block';
                const proxyUrl = 'https://api.allorigins.win/raw?url=';
                const url = encodeURIComponent('https://www.bing.com/HPImageArchive.aspx?format=js&n=8');
                
                const response = await fetch(proxyUrl + url, { 
                    signal: controller.signal 
                });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error(`HTTP错误 ${response.status}`);
                const data = await response.json();
                const images = data.images;
                const randomImage = images[Math.floor(Math.random() * images.length)];
                const imgUrl = proxyUrl + encodeURIComponent(`https://www.bing.com${randomImage.url}`);

                // 预加载图片
                await new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => {
                        panel.style.backgroundImage = `url("${imgUrl}")`;
                        localStorage.setItem('bingBg', JSON.stringify({
                            date: today,
                            url: imgUrl
                        }));
                        
                        // 添加版权信息
                        const copyrightEl = document.createElement('div');
                        copyrightEl.className = 'bg-copyright';
                        const cleanedCopyright = randomImage.copyright.replace(/(.*?)\s*$.*?$/, '$1');
                        copyrightEl.textContent = `${cleanedCopyright} (Bing每日壁纸)`;
                        document.body.appendChild(copyrightEl);
                        
                        resolve();
                    };
                    img.onerror = reject;
                    img.src = imgUrl;
                });

            } catch (error) {
                clearTimeout(timeoutId);
                if (retryCount < MAX_RETRIES) {
                    retryCount++;
                    return attemptLoad();
                }
                throw error;
            } finally {
                bgStatus.style.display = 'none';
            }
        }

        try {
            await attemptLoad();
        } catch {
            panel.style.backgroundImage = 'var(--main-gradient)';
        }
    }

    // 移动菜单控制
    function initMobileMenu() {
        const btn = document.querySelector('.btn-mobile-menu');
        const nav = document.querySelector('.navigation-wrapper');
        
        if (!btn || !nav) return;

        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isVisible = nav.classList.contains('visible');
            nav.classList.toggle('visible', !isVisible);
            document.body.style.overflow = isVisible ? '' : 'hidden';
        });

        // 点击外部关闭
        document.addEventListener('click', (e) => {
            if (nav.classList.contains('visible') && 
                !nav.contains(e.target) && 
                !btn.contains(e.target)) {
                nav.classList.remove('visible');
                document.body.style.overflow = '';
            }
        });
    }

    // 加载一言
    async function loadHitokoto() {
        const target = document.getElementById('hitokoto');
        try {
            const controller = new AbortController();
            setTimeout(() => controller.abort(), 5000);
            
            const response = await fetch('https://v1.hitokoto.cn', { 
                signal: controller.signal 
            });
            
            const data = await response.json();
            target.innerHTML = `
                <p>${data.hitokoto}</p>
                <footer>-「${data.from}」</footer>
            `;
        } catch {
            target.innerHTML = `
                <p style="color:#999">加载失败，使用默认诗句</p>
                <p>如何得与凉风约，不共尘沙一并来！</p>
                <footer>-「中牟道中」</footer>
            `;
        }
    }

    // 头像加载处理
    function handleAvatarLoad() {
        const placeholder = document.querySelector('.img-placeholder');
        const avatarImg = document.querySelector('.js-avatar');
        
        if (avatarImg.complete) {
            placeholder.style.display = 'none';
            avatarImg.style.opacity = 1;
        } else {
            avatarImg.addEventListener('load', () => {
                placeholder.style.display = 'none';
                avatarImg.style.opacity = 1;
            });
            avatarImg.addEventListener('error', () => {
                placeholder.style.display = 'block';
            });
        }
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', () => {
        loadBingBackground();
        initMobileMenu();
        loadHitokoto();
        handleAvatarLoad();
    });
</script>
</body>
</html>
